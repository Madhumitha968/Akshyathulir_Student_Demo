<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard - CropSmile</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Segoe+UI:300,400,500,700&display=swap" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/@mui/material@5.15.0/umd/material-ui.development.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/recharts@2.10.3/umd/Recharts.js"></script>

  <script crossorigin src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.6/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      background-color: #f4f9f4;
      font-family: 'Segoe UI', sans-serif;
    }

    #root {
      height: 100vh;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #1b3a2b;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-track {
      background: #e0e0e0;
    }
  </style>
</head>

<body>
  <div id="root" style="display: flex; align-items: center; justify-content: center; height: 100vh;">
    Loading Dashboard...
  </div>

  <script type="text/babel">
    const {
      createTheme, ThemeProvider, CssBaseline,
      Box, Drawer, List, ListItem, ListItemButton, ListItemIcon, ListItemText,
      Typography, Avatar, Grid, Paper, Card, CardContent, Button, Divider, Chip,
      IconButton, Collapse, Table, TableBody, TableCell, TableContainer, TableHead, TableRow,
      LinearProgress, AppBar, Toolbar, Stepper, Step, StepLabel, TextField, InputAdornment,
      Dialog, DialogTitle, DialogContent, DialogActions, Slide, Checkbox, FormControlLabel,
      Radio, RadioGroup, MenuItem, Select, FormControl, FormLabel, Fade, CardActionArea
    } = MaterialUI;

    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

    const Transition = React.forwardRef(function Transition(props, ref) {
      return <Slide direction="up" ref={ref} {...props} />;
    });

    const Icon = ({ name, color, style }) => (
      <span className="material-icons" style={{ color: color || 'inherit', ...style }}>{name}</span>
    );

    const theme = createTheme({
      palette: {
        primary: { main: '#1b3a2b' },
        secondary: { main: '#4caf50' },
        background: { default: '#f4f9f4', paper: '#ffffff' },
      },
      typography: {
        fontFamily: '"Segoe UI", sans-serif',
        h5: { fontWeight: 600 },
      },
      components: {
        MuiCard: { styleOverrides: { root: { borderRadius: '16px', boxShadow: '0 4px 12px rgba(0,0,0,0.05)' } } },
        MuiButton: { styleOverrides: { root: { textTransform: 'none', fontWeight: 600 } } },
        MuiDialog: { styleOverrides: { paper: { borderRadius: '16px' } } },
        MuiAppBar: { styleOverrides: { root: { zIndex: 1201 } } }
      },
    });

    // --- EXPANDED DATA SOURCE ---
    const ALL_GRANTS_DATA = [
      // --- TECH GRANTS ---
      { id: 1, title: 'AI Innovation Fund', amount: '₹5,00,000', deadline: 'Jan 30, 2026', tags: ['Tech', 'AI'], location: 'Bangalore', gender: 'All' },
      { id: 2, title: 'Women in Coding Scholarship', amount: '₹3,50,000', deadline: 'Mar 01, 2026', tags: ['Tech', 'Women', 'Diversity'], location: 'Remote', gender: 'Female' },
      { id: 7, title: 'Female Tech Leader Award', amount: '₹1,50,000', deadline: 'Mar 08, 2026', tags: ['Tech', 'Women'], location: 'Mumbai', gender: 'Female' },

      // --- RESEARCH GRANTS ---
      { id: 9, title: 'Bio-Medical Research Grant', amount: '₹8,00,000', deadline: 'Jul 01, 2026', tags: ['Research', 'Health'], location: 'Kerala', gender: 'All' },
      { id: 10, title: 'Sustainable Energy Study', amount: '₹4,50,000', deadline: 'Sep 15, 2026', tags: ['Research', 'Govt'], location: 'Gujarat', gender: 'All' },

      { id: 15, title: 'Women in Science Grant', amount: '₹5,00,000', deadline: 'May 30, 2026', tags: ['Research', 'Women'], location: 'Kolkata', gender: 'Female' },

      // --- GOVT & GENERAL ---
      { id: 17, title: 'Rural Entrepreneur Scheme', amount: '₹2,00,000', deadline: 'Mar 15, 2026', tags: ['Govt', 'Social'], location: 'Bihar', gender: 'All' },
      { id: 18, title: 'Tamil Nadu Innovation Voucher', amount: '₹1,00,000', deadline: 'Jun 30, 2026', tags: ['Govt', 'State'], location: 'Chennai', gender: 'All' },
    ];

    // --- DETAIL PAGE COMPONENTS ---

    const ApplicationDetailView = ({ item, onBack }) => {
      if (!item) return null;
      const steps = ['Submitted', 'Under Review', 'Interview', 'Final Decision'];
      const activeStep = item.status === 'Approved' ? 4 : item.status === 'Interview' ? 2 : 1;

      return (
        <Box>
          <Button startIcon={<Icon name="arrow_back" />} onClick={onBack} sx={{ mt: 3 }}>Back to List</Button>
          <Paper sx={{ p: 4, mb: 3 }}>
            <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start', mb: 3 }}>
              <Box>
                <Chip label={item.type} size="small" sx={{ mb: 1, bgcolor: '#e8f5e9', color: '#1b3a2b' }} />
                <Typography variant="h4" color="#1b3a2b" fontWeight="bold">{item.title}</Typography>
                <Typography variant="subtitle1" color="text.secondary">Application ID: {item.id}</Typography>
              </Box>
              <Chip label={item.status} color={item.color} sx={{ px: 2, height: 32 }} />
            </Box>
            <Divider sx={{ my: 3 }} />
            <Typography variant="h6" gutterBottom>Application Status</Typography>
            <Box sx={{ width: '100%', mb: 4, mt: 2 }}>
              <Stepper activeStep={activeStep} alternativeLabel>
                {steps.map((label) => (<Step key={label}><StepLabel>{label}</StepLabel></Step>))}
              </Stepper>
            </Box>
            <Grid container spacing={4}>
              <Grid item xs={12} md={8}>
                <Typography variant="h6" gutterBottom>Submission Details</Typography>
                <Paper variant="outlined" sx={{ p: 2, bgcolor: '#fafafa' }}>
                  <Grid container spacing={2}>
                    <Grid item xs={6}><Typography variant="body2" color="text.secondary">Submitted On:</Typography></Grid>
                    <Grid item xs={6}><Typography variant="body2" fontWeight="bold">{item.date}</Typography></Grid>
                    <Grid item xs={6}><Typography variant="body2" color="text.secondary">Reviewer:</Typography></Grid>
                    <Grid item xs={6}><Typography variant="body2" fontWeight="bold">Prof. A. Sharma</Typography></Grid>
                    <Grid item xs={12} sx={{ mt: 1 }}>
                      <Typography variant="body2" color="text.secondary">Remarks:</Typography>
                      <Typography variant="body2" sx={{ mt: 0.5, fontStyle: 'italic' }}>"Proposal looks promising. Please prepare the budget breakdown for the next interview phase."</Typography>
                    </Grid>
                  </Grid>
                </Paper>
              </Grid>
              <Grid item xs={12} md={4}>
                <Typography variant="h6" gutterBottom>Actions</Typography>
                <Box sx={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
                  <Button variant="outlined" startIcon={<Icon name="visibility" />}>View Submitted PDF</Button>
                  <Button variant="outlined" startIcon={<Icon name="edit" />} disabled={item.status !== 'Pending'}>Edit Application</Button>
                  <Button variant="contained" color="error" disabled={item.status === 'Approved'}>Withdraw</Button>
                </Box>
              </Grid>
            </Grid>
          </Paper>
        </Box>
      );
    };

    const FundingDetailView = ({ item, onBack }) => {
      if (!item) return null;
      return (
        <Box>
          <Button startIcon={<Icon name="arrow_back" />} onClick={onBack} sx={{ mb: 2 }}>Back to Funding</Button>
          <Grid container spacing={3}>
            <Grid item xs={12} md={8}>
              <Paper sx={{ p: 4, height: '100%' }}>
                <Box sx={{ display: 'flex', gap: 2, mb: 3 }}>
                  <Avatar sx={{ width: 64, height: 64, bgcolor: '#e8f5e9', color: '#1b3a2b' }} variant="rounded"><Icon name="monetization_on" style={{ fontSize: 32 }} /></Avatar>
                  <Box>
                    <Typography variant="h5" fontWeight="bold">{item.name}</Typography>
                    <Typography variant="h6" color="success.main">{item.range}</Typography>
                    <Typography variant="body2" color="text.secondary">Investor: {item.investor}</Typography>
                  </Box>
                </Box>
                <Divider sx={{ my: 3 }} />
                <Typography variant="h6" gutterBottom>About the Opportunity</Typography>
                <Typography paragraph color="text.secondary">This funding round is focused on early-stage startups in the AgriTech and Sustainability sectors.</Typography>
                <Typography variant="h6" gutterBottom sx={{ mt: 3 }}>Requirements</Typography>
                <List dense>
                  <ListItem><ListItemIcon><Icon name="check" color="green" /></ListItemIcon><ListItemText primary="Minimum Viable Product (MVP) Ready" /></ListItem>
                  <ListItem><ListItemIcon><Icon name="check" color="green" /></ListItemIcon><ListItemText primary="Registered Entity (LLP/Pvt Ltd)" /></ListItem>
                  <ListItem><ListItemIcon><Icon name="check" color="green" /></ListItemIcon><ListItemText primary="Pitch Deck (Max 15 Slides)" /></ListItem>
                </List>
              </Paper>
            </Grid>
            <Grid item xs={12} md={4}>
              <Card sx={{ bgcolor: '#1b3a2b', color: 'white' }}>
                <CardContent sx={{ p: 3 }}>
                  <Typography variant="h6" gutterBottom>Apply Now</Typography>
                  <Typography variant="body2" sx={{ opacity: 0.8, mb: 3 }}>Submissions close on Jan 31, 2026. Make sure your profile is updated.</Typography>
                  <Button variant="contained" color="secondary" fullWidth size="large" sx={{ mb: 2 }}>Submit Pitch Deck</Button>
                  <Button variant="outlined" sx={{ color: 'white', borderColor: 'rgba(255,255,255,0.3)' }} fullWidth>Save for Later</Button>
                </CardContent>
              </Card>
            </Grid>
          </Grid>
        </Box>
      );
    };

    const GrantApplicationDialog = ({ open, grant, onClose }) => {
      const fileInputRef = React.useRef(null);
      if (!grant) return null;
      return (
        <Dialog open={open} onClose={onClose} maxWidth="md" fullWidth TransitionComponent={Transition} scroll="paper">
          <DialogTitle component="div" sx={{ bgcolor: '#1b3a2b', color: 'white', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <Box>
              <Typography variant="h6" component="div">Apply for Grant</Typography>
              <Typography variant="caption" component="div" sx={{ opacity: 0.8 }}>{grant.title} • {grant.amount}</Typography>
            </Box>
            <IconButton onClick={onClose} sx={{ color: 'white' }}><Icon name="close" /></IconButton>
          </DialogTitle>
          <DialogContent dividers sx={{ p: 4 }}>
            <Grid container spacing={3}>
              <Grid item xs={12} sm={6}>
                <Typography variant="subtitle2" fontWeight="bold" gutterBottom>Applicant Name</Typography>
                <TextField fullWidth defaultValue="Student User" disabled variant="outlined" size="small" />
              </Grid>
              <Grid item xs={12} sm={6}>
                <Typography variant="subtitle2" fontWeight="bold" gutterBottom>Email Address</Typography>
                <TextField fullWidth defaultValue="student@university.edu" disabled variant="outlined" size="small" />
              </Grid>
              <Grid item xs={12}>
                <Typography variant="subtitle2" fontWeight="bold" gutterBottom>Project Title <span style={{ color: 'red' }}>*</span></Typography>
                <TextField fullWidth placeholder="Enter the title of your project" variant="outlined" />
              </Grid>
              <Grid item xs={12}>
                <Typography variant="subtitle2" fontWeight="bold" gutterBottom>Statement of Purpose <span style={{ color: 'red' }}>*</span></Typography>
                <TextField fullWidth multiline rows={4} placeholder="Why do you need this grant? (Max 200 words)" variant="outlined" />
              </Grid>
              <Grid item xs={12}>
                <Typography variant="subtitle2" fontWeight="bold" gutterBottom>Supporting Documents</Typography>
                <input type="file" ref={fileInputRef} style={{ display: 'none' }} onChange={(e) => alert(`File Selected: ${e.target.files[0]?.name}`)} />
                <Box onClick={() => fileInputRef.current.click()} sx={{ border: '2px dashed #ccc', borderRadius: 2, p: 3, textAlign: 'center', cursor: 'pointer', bgcolor: '#fafafa', '&:hover': { bgcolor: '#f0f0f0', borderColor: '#1b3a2b' } }}>
                  <Icon name="cloud_upload" style={{ fontSize: 32, color: '#999' }} />
                  <Typography variant="body2" color="textSecondary">Click to upload Proposal (PDF)</Typography>
                </Box>
              </Grid>
            </Grid>
          </DialogContent>
          <DialogActions sx={{ p: 3, bgcolor: '#f9f9f9' }}>
            <Button onClick={onClose} variant="outlined" color="inherit">Cancel</Button>
            <Button variant="contained" color="primary" onClick={onClose}>Submit Application</Button>
          </DialogActions>
        </Dialog>
      );
    };

    const FundingRequestDialog = ({ open, onClose }) => {
      const fileInputRef = React.useRef(null);
      const [termsAccepted, setTermsAccepted] = React.useState(false);
      return (
        <Dialog open={open} onClose={onClose} maxWidth="md" fullWidth TransitionComponent={Transition} scroll="paper">
          <DialogTitle component="div" sx={{ bgcolor: '#1b3a2b', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <Box sx={{ display: 'flex', alignItems: 'center', gap: 2 }}>
              <Avatar variant="rounded" sx={{ bgcolor: 'rgba(255,255,255,0.15)', color: 'white' }}><Icon name="campaign" /></Avatar>
              <Box>
                <Typography variant="h6" component="div">Request Funding</Typography>
                <Typography variant="caption" component="div" sx={{ opacity: 0.8 }}>Submit proposal to Investor Network</Typography>
              </Box>
            </Box>
            <IconButton onClick={onClose} sx={{ color: 'white' }}><Icon name="close" /></IconButton>
          </DialogTitle>
          <DialogContent dividers sx={{ p: 4 }}>
            <Grid container spacing={3}>
              <Grid item xs={12}><Typography variant="subtitle2" fontWeight="bold" color="#1b3a2b">PROJECT DETAILS</Typography></Grid>
              <Grid item xs={12} sm={8}><TextField fullWidth label="Startup / Project Title" placeholder="e.g. EcoWare Solutions" variant="outlined" size="small" /></Grid>
              <Grid item xs={12} sm={4}><TextField select fullWidth label="Category" SelectProps={{ native: true }} size="small" variant="outlined"><option>AgriTech</option><option>EdTech</option><option>FinTech</option><option>Sustainability</option></TextField></Grid>
              <Grid item xs={12} sm={6}><TextField fullWidth label="Amount Needed" type="number" size="small" variant="outlined" InputProps={{ startAdornment: <InputAdornment position="start">₹</InputAdornment> }} /></Grid>
              <Grid item xs={12} sm={6}><TextField fullWidth label="Equity Offer (%)" type="number" size="small" variant="outlined" InputProps={{ endAdornment: <InputAdornment position="end">%</InputAdornment> }} /></Grid>
              <Grid item xs={12}><TextField fullWidth multiline rows={4} variant="outlined" label="Utilization Plan & Pitch" placeholder="Describe your solution and how funds will be used..." /></Grid>
              <Grid item xs={12}>
                <Typography variant="subtitle2" fontWeight="bold" gutterBottom>Pitch Deck (PDF)</Typography>
                <Box onClick={() => fileInputRef.current.click()} sx={{ border: '2px dashed #ccc', borderRadius: 2, p: 2, textAlign: 'center', cursor: 'pointer', bgcolor: '#fafafa', '&:hover': { bgcolor: '#f0f0f0', borderColor: '#1b3a2b' } }}>
                  <input type="file" ref={fileInputRef} style={{ display: 'none' }} />
                  <Icon name="cloud_upload" style={{ fontSize: 32, color: '#1b3a2b' }} />
                  <Typography variant="body2" fontWeight="bold">Click to Upload PDF</Typography>
                </Box>
              </Grid>
              <Grid item xs={12}>
                <FormControlLabel control={<Checkbox checked={termsAccepted} onChange={(e) => setTermsAccepted(e.target.checked)} sx={{ color: '#1b3a2b', '&.Mui-checked': { color: '#1b3a2b' } }} />} label={<Typography variant="body2">I certify that the information provided is accurate.</Typography>} />
              </Grid>
            </Grid>
          </DialogContent>
          <DialogActions sx={{ p: 3, bgcolor: '#f9f9f9' }}>
            <Button onClick={onClose} variant="outlined" color="inherit">Cancel</Button>
            <Button variant="contained" disabled={!termsAccepted} onClick={onClose} sx={{ bgcolor: '#1b3a2b', '&:hover': { bgcolor: '#142e22' } }}>Submit Request</Button>
          </DialogActions>
        </Dialog>
      );
    };

    const StudentRegistrationForm = ({ open, onClose }) => {
      const [formData, setFormData] = React.useState({
        firstName: '', lastName: '', email: '', mobile: '',
        dob: '', gender: '', religion: '', community: '',
        institutionType: '', schoolName: '', schoolGrade: '', medium: 'English', board: '',
        schoolType: '', schoolDistrict: '', schoolState: '',
        collegeName: '', dept: '', degree: '', yearStudy: '',
        parentName: '', relationship: '', parentContact: '', emergencyContact: '',
        pincode: '', country: '', state: '', district: '', area: '',
        appType: 'individual', ideaName: '', domain: '', problemStmt: '', solutionDesc: '',
        teamCount: '', teamLeader: '', leaderContact: '',
        declaration: false
      });

      const handlePincodeChange = async (e) => {
        const pin = e.target.value;
        if (!/^\d*$/.test(pin) || pin.length > 6) return;
        setFormData(prev => ({ ...prev, pincode: pin }));
        if (pin.length === 6) {
          try {
            setFormData(prev => ({ ...prev, state: 'Fetching...', district: 'Fetching...' }));
            const res = await fetch(`https://api.postalpincode.in/pincode/${pin}`);
            const data = await res.json();
            if (data[0].Status === "Success") {
              const { State, District, Name } = data[0].PostOffice[0];
              setFormData(prev => ({ ...prev, state: State, district: District, area: Name, country: 'India' }));
            } else {
              alert("Invalid Pincode.");
              setFormData(prev => ({ ...prev, state: '', district: '', area: '', country: '' }));
            }
          } catch (err) {
            setFormData(prev => ({ ...prev, state: '', district: '', country: '' }));
          }
        } else {
          if (pin.length === 0) setFormData(prev => ({ ...prev, state: '', district: '', area: '', country: '' }));
        }
      };

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
      };

      const styles = {
        primaryGreen: '#1b3a2b', hoverGreen: '#142e22', bgLight: '#f8f9fa',
        sectionHeader: { backgroundColor: '#1b3a2b', color: 'white', padding: '10px 20px', fontWeight: 600, fontSize: '1.1rem', marginBottom: '20px', borderRadius: '2px', textAlign: 'center', marginTop: '20px', fontFamily: '"Segoe UI", sans-serif' },
        label: { fontWeight: 600, marginBottom: '5px', display: 'block', color: '#333', fontSize: '0.9rem' },
        requiredStar: { color: '#d32f2f', marginLeft: '3px', fontWeight: 'bold' },
        subLabel: { fontSize: '0.8em', color: '#666', marginTop: '4px', display: 'block' },
        input: { '& .MuiOutlinedInput-root': { bgcolor: 'white' } }
      };

      const SectionHeader = ({ title }) => (<Box sx={styles.sectionHeader}>{title}</Box>);
      const Label = ({ text, required, subText }) => (
        <Box><Typography variant="body2" sx={styles.label}>{text} {required && <span style={styles.requiredStar}>*</span>}</Typography>{subText && <Typography variant="caption" sx={{ color: '#666', fontStyle: 'italic' }}>{subText}</Typography>}</Box>
      );

      return (
        <Dialog open={open} onClose={onClose} fullWidth maxWidth="lg" scroll="paper" TransitionComponent={Transition}>
          <DialogTitle component="div" sx={{ bgcolor: '#1b3a2b', color: 'white', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <Typography variant="h6" component="div">My Profile</Typography>
            <IconButton onClick={onClose} sx={{ color: 'white' }}><Icon name="close" /></IconButton>
          </DialogTitle>
          <DialogContent dividers sx={{ bgcolor: '#f4f9f4', p: 3 }}>
            <Box sx={{ maxWidth: '100%', mx: 'auto' }}>
              <form onSubmit={(e) => { e.preventDefault(); alert("Profile Updated Successfully!"); onClose(); }} autoComplete="off">
                <Paper elevation={0} sx={{ p: 0, bgcolor: 'transparent' }}>
                  <Box sx={{ bgcolor: 'white', borderRadius: 2, border: '1px solid #ddd', p: 0, overflow: 'hidden' }}>
                    <SectionHeader title="Personal Information" />
                    <Box sx={{ px: 4, pb: 2 }}>
                      <Grid container spacing={3}>
                        <Grid item xs={12} sm={6}><Label text="First Name" required /><TextField fullWidth name="firstName" value={formData.firstName} onChange={handleChange} sx={styles.input} /></Grid>
                        <Grid item xs={12} sm={6}><Label text="Last Name" required /><TextField fullWidth name="lastName" value={formData.lastName} onChange={handleChange} sx={styles.input} /></Grid>
                        <Grid item xs={12} sm={6}><Label text="Email Address" required /><TextField fullWidth type="email" name="email" value={formData.email} onChange={handleChange} sx={styles.input} /></Grid>
                        <Grid item xs={12} sm={6}><Label text="Mobile Number (without SDI Code)" required /><TextField fullWidth type="tel" name="mobile" value={formData.mobile} onChange={handleChange} sx={styles.input} /></Grid>
                        <Grid item xs={12} sm={3}><Label text="Date of Birth" /><TextField fullWidth type="date" name="dob" value={formData.dob} onChange={handleChange} sx={styles.input} InputLabelProps={{ shrink: true }} /></Grid>
                        <Grid item xs={12} sm={3}><Label text="Gender" required /><RadioGroup row name="gender" value={formData.gender} onChange={handleChange} sx={{ flexWrap: 'nowrap', mt: 1 }}>{['Male', 'Female', 'Other'].map(opt => <FormControlLabel key={opt} value={opt} control={<Radio size="small" sx={{ color: styles.primaryGreen, '&.Mui-checked': { color: styles.primaryGreen }, p: 0.5 }} />} label={<Typography variant="body2" sx={{ fontSize: '0.85rem' }}>{opt}</Typography>} sx={{ mr: 1, ml: 0 }} />)}</RadioGroup></Grid>
                        <Grid item xs={12} sm={6}><Label text="Community" /><TextField select fullWidth name="community" value={formData.community} onChange={handleChange} sx={styles.input}><MenuItem value="" disabled>Select Community</MenuItem>{['OC', 'BC', 'MBC', 'SC/ST'].map(opt => <MenuItem key={opt} value={opt}>{opt}</MenuItem>)}</TextField></Grid>
                      </Grid>
                    </Box>
                    <SectionHeader title="Academic Details" />
                    <Box sx={{ px: 4, pb: 2 }}>
                      <Box sx={{ mb: 3 }}>
                        <Label text="Are you from School or College?" />
                        <RadioGroup row name="institutionType" value={formData.institutionType} onChange={handleChange}>
                          <FormControlLabel value="school" control={<Radio sx={{ color: styles.primaryGreen, '&.Mui-checked': { color: styles.primaryGreen } }} />} label="School" />
                          <FormControlLabel value="college" control={<Radio sx={{ color: styles.primaryGreen, '&.Mui-checked': { color: styles.primaryGreen } }} />} label="College" />
                        </RadioGroup>
                      </Box>
                      {formData.institutionType === 'school' && (
                        <Grid container spacing={3}>
                          <Grid item xs={12} sm={6}><Label text="School Name" required /><TextField fullWidth name="schoolName" value={formData.schoolName} onChange={handleChange} sx={styles.input} /></Grid>
                          <Grid item xs={12} sm={6}><Label text="Class / Grade" required /><TextField fullWidth name="schoolGrade" value={formData.schoolGrade} onChange={handleChange} sx={styles.input} /></Grid>
                          <Grid item xs={12} sm={6}><Label text="School type" /><TextField fullWidth name="schoolState" value={formData.schoolState} onChange={handleChange} sx={styles.input} /></Grid>

                          <Grid item xs={12} sm={6}><Label text="Medium" /><TextField select fullWidth name="medium" value={formData.medium} onChange={handleChange} sx={styles.input}>{['English', 'Tamil', 'Hindi', 'Other'].map(opt => <MenuItem key={opt} value={opt}>{opt}</MenuItem>)}</TextField></Grid>
                          <Grid item xs={12} sm={6}><Label text="District" /><TextField fullWidth name="schoolDistrict" value={formData.schoolDistrict} onChange={handleChange} sx={styles.input} /></Grid>
                          <Grid item xs={12} sm={6}><Label text="State" /><TextField fullWidth name="schoolState" value={formData.schoolState} onChange={handleChange} sx={styles.input} /></Grid>

                        </Grid>
                      )}

          </Grid>
          <Grid item xs={12} md={4}>
            <Card onClick={() => onChangeView('Project Funding')} sx={{ height: '100%', cursor: 'pointer', borderRadius: 4, transition: 'all 0.3s ease', '&:hover': { transform: 'translateY(-8px)', boxShadow: '0 12px 30px rgba(255, 152, 0, 0.15)' }, position: 'relative', overflow: 'hidden' }}>
              <Box sx={{ position: 'absolute', top: -20, right: -20, width: 100, height: 100, borderRadius: '50%', bgcolor: 'rgba(255, 152, 0, 0.1)' }} />
              <CardContent sx={{ p: 4, textAlign: 'center' }}>
                <Avatar sx={{ bgcolor: '#fff3e0', color: '#ef6c00', width: 70, height: 70, mb: 2, mx: 'auto' }}><Icon name="monetization_on" style={{ fontSize: 36 }} /></Avatar>
                <Typography variant="h6" fontWeight="bold" gutterBottom>Project Funding</Typography>
                <Chip label="Seed Capital" size="small" sx={{ mb: 2, borderRadius: 1, bgcolor: '#ffcc80', color: '#e65100', fontWeight: 'bold' }} />
                <Typography variant="body2" color="text.secondary" sx={{ lineHeight: 1.6 }}>Pitch your startup ideas to investors and secure early-stage funding to kickstart your venture.</Typography>
              </CardContent>
            </Card>
          </Grid>
        </Grid>
      </Box>
    );

    const StatCard = ({ title, value, icon, color, subtext }) => (
      <Card sx={{ height: '100%', display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
        <CardContent>
          <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
            <Box>
              <Typography color="textSecondary" gutterBottom variant="subtitle2">{title}</Typography>
              <Typography variant="h4" fontWeight="bold" sx={{ color: '#1b3a2b' }}>{value}</Typography>
            </Box>
            <Avatar sx={{ bgcolor: `${color}15`, color: color, width: 48, height: 48 }}><Icon name={icon} /></Avatar>
          </Box>
          <Box sx={{ mt: 2 }}><Chip label={subtext} size="small" sx={{ bgcolor: `${color}15`, color: color, fontWeight: 'bold' }} /></Box>
        </CardContent>
      </Card>
    );

    const DashboardHome = () => {
      const chartData = [{ name: 'Jan', progress: 20 }, { name: 'Feb', progress: 45 }, { name: 'Mar', progress: 30 }, { name: 'Apr', progress: 70 }, { name: 'May', progress: 55 }, { name: 'Jun', progress: 90 },];
      return (
        <Box>
          <Grid container spacing={3} sx={{ mb: 4 }}>
            <Grid item xs={12} sm={4}><StatCard title="Eligible Govt Schemes" value="12" subtext="3 New Added" icon="account_balance" color="#d32f2f" /></Grid>
            <Grid item xs={12} sm={4}><StatCard title="Active Internships" value="5" subtext="2 Interview Calls" icon="work" color="#ff9800" /></Grid>
            <Grid item xs={12} sm={4}><StatCard title="Course Certificates" value="8" subtext="Download Available" icon="verified" color="#2e7d32" /></Grid>
          </Grid>
          <Grid container spacing={3}>
            <Grid item xs={12} md={8}>
              <Paper sx={{ p: 3, height: 400 }}>
                <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 2 }}>
                  <Typography variant="h6">Learning Progress</Typography>
                  <Box><Button size="small" variant="contained" sx={{ bgcolor: '#1b3a2b' }}>Year</Button><Button size="small">Month</Button></Box>
                </Box>
                <ResponsiveContainer width="100%" height="85%">
                  <LineChart data={chartData}><CartesianGrid strokeDasharray="3 3" vertical={false} /><XAxis dataKey="name" axisLine={false} tickLine={false} /><YAxis axisLine={false} tickLine={false} /><Tooltip /><Line type="monotone" dataKey="progress" stroke="#4caf50" strokeWidth={3} dot={{ r: 4, fill: '#1b3a2b' }} /></LineChart>
                </ResponsiveContainer>
              </Paper>
            </Grid>
            <Grid item xs={12} md={4}>
              <Paper sx={{ p: 3, height: 400, overflow: 'auto' }}>
                <Typography variant="h6" sx={{ mb: 2 }}>Recent Activity</Typography>
                <List>
                  {[{ title: 'Completed UX Module', date: 'Dec 16', type: 'Course' }, { title: 'Applied for Grant', date: 'Dec 10', type: 'Funding' }, { title: 'Hackathon Reg.', date: 'Dec 03', type: 'Event' }].map((item, index) => (
                    <React.Fragment key={index}>
                      <ListItem sx={{ px: 0 }}><ListItemText primary={<Typography variant="subtitle2" fontWeight="bold">{item.title}</Typography>} secondary={`${item.date} • ${item.type}`} /><Icon name="check_circle" color="#4caf50" style={{ fontSize: 16 }} /></ListItem><Divider component="li" />
                    </React.Fragment>
                  ))}
                </List>
              </Paper>
            </Grid>
          </Grid>
        </Box>
      );
    };

    const Sidebar = ({ onNavigate, currentView }) => {
      const [openState, setOpenState] = React.useState({});
      const handleToggle = (text) => setOpenState(prev => ({ ...prev, [text]: !prev[text] }));
      const menuItems = [
        { text: 'Dashboard', icon: 'dashboard', view: 'Dashboard' },
        { text: 'Profile', icon: 'person', view: 'Profile' },
        { text: 'Learning', icon: 'school', subItems: ['My Courses', 'Skill Development', 'Certifications'] },
        { text: 'Career', icon: 'work', subItems: ['Internships', 'Startup Projects'] },
        { text: 'Applications', icon: 'assignment', view: 'Applications', subItems: ['My Applications', 'Student Grants', 'Project Funding'] },
        { text: 'Competitions', icon: 'emoji_events', subItems: ['Hackathons', 'Competitions'] },
        { text: 'Network', icon: 'groups', subItems: ['Mentorship', 'Student Network'] },
        { text: 'Resources', icon: 'library_books', subItems: ['Templates Library', 'Toolkits'] },
        { text: 'Campus Amb.', icon: 'campaign' },
        { text: 'Settings', icon: 'settings' },
      ];
      return (
        <Drawer variant="permanent" sx={{ width: 260, flexShrink: 0, '& .MuiDrawer-paper': { width: 260, boxSizing: 'border-box', backgroundColor: '#1b3a2b', color: 'white' } }}>
          <Box sx={{ p: 3, display: 'flex', alignItems: 'center', gap: 2 }}><Typography variant="h6" fontWeight="bold" sx={{ color: '#fff' }}>STUDENT</Typography></Box>
          <List component="nav">
            {menuItems.map((item) => (
              <React.Fragment key={item.text}>
                <ListItem disablePadding>
                  <ListItemButton onClick={() => { if (item.subItems) handleToggle(item.text); if (item.view) onNavigate(item.view); }} sx={{ mb: 0.5, bgcolor: currentView === item.view ? 'rgba(255,255,255,0.1)' : 'transparent', '&:hover': { bgcolor: 'rgba(255,255,255,0.1)' } }}>
                    <ListItemIcon sx={{ minWidth: 40 }}><Icon name={item.icon} color="#b0bec5" /></ListItemIcon>
                    <ListItemText primary={item.text} />
                    {item.subItems && (<Icon name={openState[item.text] ? "expand_less" : "expand_more"} color="#b0bec5" />)}
                  </ListItemButton>
                </ListItem>
                {item.subItems && (
                  <Collapse in={openState[item.text]} timeout="auto" unmountOnExit>
                    <List component="div" disablePadding>
                      {item.subItems.map((subItem) => (
                        <ListItemButton key={subItem} onClick={() => onNavigate(subItem)} sx={{ pl: 9, bgcolor: currentView === subItem ? 'rgba(76, 175, 80, 0.2)' : 'transparent', '&:hover': { bgcolor: 'rgba(255,255,255,0.05)' } }}>
                          <ListItemText primary={subItem} primaryTypographyProps={{ fontSize: '0.85rem', color: '#cfd8dc' }} />
                        </ListItemButton>
                      ))}
                    </List>
                  </Collapse>
                )}
              </React.Fragment>
            ))}
          </List>
        </Drawer>
      );
    };

    const App = () => {
      const [currentView, setCurrentView] = React.useState('Dashboard');
      const [selectedItem, setSelectedItem] = React.useState(null);
      const [isGrantModalOpen, setGrantModalOpen] = React.useState(false);
      const [selectedGrant, setSelectedGrant] = React.useState(null);
      const [isFundingModalOpen, setFundingModalOpen] = React.useState(false);
      const [isProfileModalOpen, setProfileModalOpen] = React.useState(false);

      const handleNavigation = (view) => {
        if (view === 'Profile') setProfileModalOpen(true);
        else setCurrentView(view);
      };
      const handleViewDetails = (viewName, item) => { setSelectedItem(item); setCurrentView(viewName); };
      const handleOpenGrantModal = (grant) => { setSelectedGrant(grant); setGrantModalOpen(true); };

      const renderContent = () => {
        switch (currentView) {
          case 'Dashboard': return <DashboardHome />;
          case 'Applications': return <ApplicationsOverview onChangeView={setCurrentView} />;
          case 'My Applications': return <MyApplicationsView onViewDetails={(item) => handleViewDetails('ApplicationDetail', item)} />;
          case 'Project Funding': return (<ProjectFundingView onViewDetails={(item) => handleViewDetails('FundingDetail', item)} onCreateRequest={() => setFundingModalOpen(true)} />);
          case 'Student Grants': return <StudentGrantsView onApply={handleOpenGrantModal} />;
          case 'ApplicationDetail': return <ApplicationDetailView item={selectedItem} onBack={() => setCurrentView('My Applications')} />;
          case 'FundingDetail': return <FundingDetailView item={selectedItem} onBack={() => setCurrentView('Project Funding')} />;
          default: return (<Box sx={{ textAlign: 'center', mt: 10 }}><Typography variant="h4" color="text.secondary">Page Under Construction</Typography></Box>);
        }
      };

      return (
        <ThemeProvider theme={theme}>
          <CssBaseline />
          <Box sx={{ display: 'flex' }}>
            <AppBar position="fixed" sx={{ width: `calc(100% - 260px)`, ml: '260px', bgcolor: '#1b3a2b', justifyContent: 'center', boxShadow: 'none', borderBottom: '1px solid rgba(255,255,255,0.1)', zIndex: (theme) => theme.zIndex.drawer + 1 }}>
              <Toolbar sx={{ display: 'flex', justifyContent: 'space-between' }}>
                <Typography variant="h6" noWrap component="div" sx={{ fontWeight: 600, fontSize: '1.1rem' }}>{currentView}</Typography>
                <Box sx={{ display: 'flex', gap: 2, alignItems: 'center' }}>
                  <IconButton sx={{ color: 'white' }}><Icon name="notifications" /></IconButton>
                  <Box sx={{ textAlign: 'right', display: { xs: 'none', sm: 'block' } }}>
                    <Typography variant="subtitle2" sx={{ fontWeight: 'bold', fontSize: '0.85rem' }}>Welcome, Student!</Typography>
                    <Typography variant="caption" sx={{ color: 'rgba(255,255,255,0.7)', fontSize: '0.7rem' }}>ID: 2026-STU</Typography>
                  </Box>
                  <Avatar sx={{ bgcolor: '#4caf50', color: 'white', width: 32, height: 32, fontSize: '0.9rem' }}>S</Avatar>
                </Box>
              </Toolbar>
            </AppBar>
            <Sidebar onNavigate={handleNavigation} currentView={currentView} />

            <Box component="main" sx={{ flexGrow: 1, p: 3, width: { sm: `calc(100% - 260px)` }, minHeight: '100vh', pt: '120px' }}>
              {renderContent()}
            </Box>

            <GrantApplicationDialog open={isGrantModalOpen} grant={selectedGrant} onClose={() => setGrantModalOpen(false)} />
            <FundingRequestDialog open={isFundingModalOpen} onClose={() => setFundingModalOpen(false)} />
            <StudentRegistrationForm open={isProfileModalOpen} onClose={() => setProfileModalOpen(false)} />
          </Box>
        </ThemeProvider>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
